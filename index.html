<!DOCTYPE html>
<html lang="en" data-theme="porch">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" />
    <title>Pixle</title>
    <link
      rel="preload"
      href="/node_modules/@fontsource/vt323/files/vt323-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // A signed-in player opening a new tab on the static landing goes straight
      // to the porch, before the signed-out page paints (src/lib/signed-in-hint.ts).
      try {
        if (location.pathname === '/' && localStorage.getItem('pixle:signed-in') === '1') {
          location.replace('/home' + location.search + location.hash)
        }
      } catch (e) {}
    </script>
    <style>
      html { background-color: #f6bd91; color-scheme: light; }
      html[data-theme="porch"] { background-color: #f6bd91; color-scheme: light; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
